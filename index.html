<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gridlines — Weekly NFL Model</title>
<style>
:root{--bg:#0b0f14;--card:#121a24;--line:#1f2c3a;--txt:#e6edf3;--dim:#8b98a5;--acc:#3fb6ff;--warn:#ffb020;--bad:#ff6b6b;--good:#3fd68a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:14px;max-width:720px;margin:auto}
h1{font-size:20px;margin:0;letter-spacing:2px}.sub{color:var(--dim);font-size:12px;margin:4px 0 14px}
.wk{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}
.wk button{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:16px;font-size:13px}
.wk button.on{background:var(--acc);color:#04121d;border-color:var(--acc);font-weight:600}
.g{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.kick{color:var(--dim);font-size:12px;margin-bottom:8px}
.teams{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.tm img{width:34px;height:34px}
.proj{text-align:center}
.proj .lbl{font-size:10px;color:var(--dim);letter-spacing:1px}
.proj .sc{font-size:20px;color:var(--acc);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.pill{background:#0e1620;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.pill b{color:var(--acc)}.edge{color:var(--warn);font-weight:600}
.flag{color:var(--bad);font-size:12px;margin-top:6px}
.brk{margin-top:8px;font-size:13px;color:var(--good)}
.brk b{color:var(--good)}
.fun{background:#101a12;border:1px solid #1e3a26;border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px}
.fun b{color:var(--good)}
.meta{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:18px;font-size:12px;color:var(--dim)}
.meta b{color:var(--txt)}h2{font-size:15px;color:var(--dim);margin:18px 0 8px;letter-spacing:1px}
</style></head><body>
<h1>GRIDLINES</h1>
<div class="sub">Weekly NFL game model &mdash; 14-factor Monte Carlo. Research, not betting advice.</div>
<div class="wk" id="weeks"></div>
<div id="out">Loading&hellip;</div>
<div id="funnels"></div>
<div class="meta" id="meta"></div>
<script>
const API='https://ekmuzafyqlbqttmfxsgw.supabase.co/functions/v1/ff-gridlines';
const LOGO=a=>{const m={WAS:'wsh',JAX:'jax'};return 'https://a.espncdn.com/i/teamlogos/nfl/500/'+(m[a]||a.toLowerCase())+'.png'};
const wkBar=document.getElementById('weeks');
for(let w=1;w<=18;w++){const b=document.createElement('button');b.textContent='Wk '+w;b.onclick=()=>load(w,b);wkBar.appendChild(b);}
function pct(x){return x==null?'-':Number(x).toFixed(0)+'%'}
function dayOf(d){try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'})}catch(e){return d}}
async function load(w,btn){
  document.querySelectorAll('.wk button').forEach(b=>b.classList.remove('on'));
  if(btn)btn.classList.add('on');else wkBar.children[w-1].classList.add('on');
  const out=document.getElementById('out');out.textContent='Simulating\u2026';
  try{
    const r=await fetch(API+'?week='+w);const d=await r.json();
    if(!d.games||!d.games.length){out.innerHTML='<div class="g">No lines captured for week '+w+' yet \u2014 cards publish when market prices land.</div>';document.getElementById('funnels').innerHTML='';document.getElementById('meta').innerHTML='';return}
    const wx=Object.fromEntries((d.weather||[]).map(x=>[x.site,x]));
    const tv=Object.fromEntries((d.travel_flags||[]).map(x=>[x.team,x]));
    const mk=Object.fromEntries((d.market||[]).map(x=>[x.home+x.away,x]));
    const sc=Object.fromEntries((d.schedule||[]).map(x=>[x.home+x.away,x]));
    const bk=Object.fromEntries((d.breakouts||[]).map(x=>[x.home+x.away,x]));
    out.innerHTML=d.games.map(g=>{
      const w1=wx[g.home];const t=tv[g.away];const m=mk[g.home+g.away]||{};const s=sc[g.home+g.away]||{};const b=bk[g.home+g.away];
      const fav=g.home_ml_pct>=50?g.home:g.away;const favp=g.home_ml_pct>=50?g.home_ml_pct:100-g.home_ml_pct;
      const when=[s.game_date?dayOf(s.game_date):null, m.kick].filter(Boolean).join(' \u00b7 ');
      return `<div class="g">
      ${when?`<div class="kick">${when}</div>`:''}
      <div class="teams">
        <span class="tm"><img src="${LOGO(g.away)}" alt="${g.away}" onerror="this.style.display='none'">${g.away}</span>
        <span class="proj"><div class="lbl">PROJ FINAL</div><div class="sc">${g.sim_away_pts}\u2013${g.sim_home_pts}</div></span>
        <span class="tm">${g.home}<img src="${LOGO(g.home)}" alt="${g.home}" onerror="this.style.display='none'"></span>
      </div>
      <div class="row">
        <span class="pill">Win: <b>${fav} ${pct(favp)}</b></span>
        <span class="pill">${g.home} ${g.book_spread>0?'+':''}${g.book_spread}: <b>${pct(g.home_cover_pct)}</b></span>
        <span class="pill">O ${g.book_total}: <b>${pct(g.over_pct)}</b></span>
        ${g.edge_note?`<span class="pill edge">${g.edge_note}</span>`:''}
      </div>
      ${b?`<div class="brk">\u2605 Breakout watch: <b>${b.player}</b> (${b.pos}, ${b.team}) \u2014 boom ${(100*b.p_boom).toFixed(0)}%</div>`:''}
      ${w1&&w1.note?`<div class="flag">Weather: ${w1.note} (${w1.game_tmax}\u00b0F, ${w1.wind_mph}mph, ${w1.precip_mm}mm)</div>`:''}
      ${t?`<div class="flag">Travel: ${t.team} ${t.miles}mi ${t.direction}, ${Math.abs(t.tz_crossed)} zones (\u2212${t.penalty_pts})</div>`:''}
      </div>`}).join('');
    const f=d.funnel_plays||[];
    document.getElementById('funnels').innerHTML=f.length?('<h2>FUNNEL PLAYS \u2014 scheme overflow</h2>'+f.map(x=>`<div class="fun"><b>${x.beneficiary}</b> (${x.ben_pos}, ${x.nfl_team} vs ${x.opp}) <b>+${x.boost_pts}</b><br><span style="color:var(--dim)">${x.driver}</span></div>`).join('')):'';
    const p=d.provenance||{};
    document.getElementById('meta').innerHTML='<b>Method:</b> '+d.method+'<br><br>'+Object.entries(p).map(([k,v])=>'&bull; <b>'+k+':</b> '+v).join('<br>')+'<br><br>Generated '+d.generated_at;
  }catch(e){out.innerHTML='<div class="g" style="color:var(--bad)">Load failed: '+e+'</div>'}
}
load(1);
</script></body></html>
